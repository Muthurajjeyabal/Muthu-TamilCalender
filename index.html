/* ---------------------------------------------------------------
   ஜோதிட கணக்கீடுகள் (Astronomy helpers)
   Meeus low-precision solar & lunar longitude formulas +
   standard sunrise/sunset & Lahiri ayanamsa approximation.
   Accuracy: sun ~0.01°, moon ~0.1°-0.3°, sunrise/sunset ~±2-3 min.
   Enough for a daily panchangam display, not temple-grade precision.
------------------------------------------------------------------*/

const rad = (d) => (d * Math.PI) / 180;
const deg = (r) => (r * 180) / Math.PI;
const norm360 = (x) => ((x % 360) + 360) % 360;

function dayOfYear(y, m, d) {
  const start = Date.UTC(y, 0, 1);
  const cur = Date.UTC(y, m - 1, d);
  return Math.floor((cur - start) / 86400000) + 1;
}

function julianDay(y, m, d, hourUT) {
  let Y = y, M = m;
  if (M <= 2) { Y -= 1; M += 12; }
  const A = Math.floor(Y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return (
    Math.floor(365.25 * (Y + 4716)) +
    Math.floor(30.6001 * (M + 1)) +
    d + B - 1524.5 + hourUT / 24
  );
}

function sunLongitude(T) {
  const L0 = norm360(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
  const M = norm360(357.52911 + 35999.05029 * T - 0.0001537 * T * T);
  const C =
    (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(rad(M)) +
    (0.019993 - 0.000101 * T) * Math.sin(rad(2 * M)) +
    0.000289 * Math.sin(rad(3 * M));
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136 * T;
  const apparent = trueLong - 0.00569 - 0.00478 * Math.sin(rad(omega));
  return norm360(apparent);
}

function moonLongitude(T) {
  const Lp = norm360(218.3164477 + 481267.88123421 * T - 0.0015786 * T * T);
  const D = rad(norm360(297.8501921 + 445267.1114034 * T - 0.0018819 * T * T));
  const M = rad(norm360(357.5291092 + 35999.0502909 * T - 0.0001536 * T * T));
  const Mp = rad(norm360(134.9633964 + 477198.8675055 * T + 0.0087414 * T * T));
  const F = rad(norm360(93.272095 + 483202.0175233 * T - 0.0036539 * T * T));

  const dL =
    6.288774 * Math.sin(Mp) +
    1.274027 * Math.sin(2 * D - Mp) +
    0.658314 * Math.sin(2 * D) +
    0.213618 * Math.sin(2 * Mp) -
    0.185116 * Math.sin(M) -
    0.114332 * Math.sin(2 * F) +
    0.058793 * Math.sin(2 * D - 2 * Mp) +
    0.057066 * Math.sin(2 * D - M - Mp) +
    0.053322 * Math.sin(2 * D + Mp) +
    0.045758 * Math.sin(2 * D - M) -
    0.04092 * Math.sin(M - Mp) -
    0.03472 * Math.sin(D) -
    0.030383 * Math.sin(M + Mp) +
    0.015327 * Math.sin(2 * D - 2 * F) -
    0.012528 * Math.sin(Mp + 2 * F);

  return norm360(Lp + dL);
}

function lahiriAyanamsa(decimalYear) {
  return 23.85 + 0.013972 * (decimalYear - 2000);
}

// Gregorian date -> Hijri (Kuwaiti tabular algorithm), with a -1 day
// regional offset commonly used on the Indian subcontinent.
function gregorianToHijri(y, m, d) {
  const jd = Math.floor(julianDay(y, m, d, 0) + 0.5) - 1;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j =
    Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) +
    Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l =
    l -
    Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) -
    Math.floor(j / 16) * Math.floor((15238 * j) / 43) +
    29;
  const hMonth = Math.floor((24 * l) / 709);
  const hDay = l - Math.floor((709 * hMonth) / 24);
  const hYear = 30 * n + j - 30;
  return { year: hYear, month: hMonth, day: hDay };
}

function gmstDegrees(jd) {
  const T = (jd - 2451545.0) / 36525;
  const gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - (T * T * T) / 38710000;
  return norm360(gmst);
}

// Tropical ascendant (Lagnam) longitude, degrees, given Julian Day (UT) and location.
function ascendantLongitude(jd, lat, lon) {
  const lst = norm360(gmstDegrees(jd) + lon); // local sidereal time, degrees
  const ramc = rad(lst);
  const eps = rad(23.4392911);
  const phi = rad(lat);
  const y = -Math.cos(ramc);
  const x = Math.sin(ramc) * Math.cos(eps) + Math.tan(phi) * Math.sin(eps);
  return norm360(deg(Math.atan2(y, x)));
}

// Low-precision two-body Keplerian planet positions (Paul Schlyter's well-known
// method) — accurate to well within a degree, plenty for "which rasi" purposes.
function keplerE(Mdeg, e) {
  let E = Mdeg + e * deg(1) * Math.sin(rad(Mdeg)) * (1 + e * Math.cos(rad(Mdeg)));
  for (let i = 0; i < 4; i++) {
    const dE = (E - e * deg(1) * Math.sin(rad(E)) - Mdeg) / (1 - e * Math.cos(rad(E)));
    E -= dE;
  }
  return E; // degrees
}
function heliocentricXYZ(elem) {
  const E = keplerE(norm360(elem.M), elem.e);
  const xv = elem.a * (Math.cos(rad(E)) - elem.e);
  const yv = elem.a * (Math.sqrt(1 - elem.e * elem.e) * Math.sin(rad(E)));
  const v = deg(Math.atan2(yv, xv));
  const r = Math.sqrt(xv * xv + yv * yv);
  const vw = rad(v + elem.w);
  const N = rad(elem.N), i = rad(elem.i);
  return {
    x: r * (Math.cos(N) * Math.cos(vw) - Math.sin(N) * Math.sin(vw) * Math.cos(i)),
    y: r * (Math.sin(N) * Math.cos(vw) + Math.cos(N) * Math.sin(vw) * Math.cos(i)),
  };
}
function earthElements(d) {
  return { N: 0, i: 0, w: norm360(282.9404 + 4.70935e-5 * d), a: 1.0, e: 0.016709 - 1.151e-9 * d, M: norm360(356.047 + 0.9856002585 * d) };
}
function jupiterElements(d) {
  return { N: norm360(100.4542 + 2.7685e-5 * d), i: 1.303 - 1.557e-7 * d, w: norm360(273.8777 + 1.645e-5 * d), a: 5.20256, e: 0.048498 + 4.469e-9 * d, M: norm360(19.895 + 0.0830853001 * d) };
}
function saturnElements(d) {
  return { N: norm360(113.6634 + 2.3898e-5 * d), i: 2.4886 - 1.081e-7 * d, w: norm360(339.3939 + 2.9766e-5 * d), a: 9.55475, e: 0.055546 - 9.499e-9 * d, M: norm360(316.967 + 0.0334442282 * d) };
}
function sideralPlanetLongitude(elemFn, jd, decimalYear) {
  const d = jd - 2451543.5;
  const earth = heliocentricXYZ(earthElements(d));
  const planet = heliocentricXYZ(elemFn(d));
  const lon = norm360(deg(Math.atan2(planet.y - earth.y, planet.x - earth.x)));
  return norm360(lon - lahiriAyanamsa(decimalYear));
}
// Current Guru (Jupiter) and Sani (Saturn) rasi, for transit-based readings.
function currentGrahaRasis(date) {
  const jd = julianDay(date.getFullYear(), date.getMonth() + 1, date.getDate(), 12);
  const decimalYear = date.getFullYear() + dayOfYear(date.getFullYear(), date.getMonth() + 1, date.getDate()) / 365.25;
  const guruLon = sideralPlanetLongitude(jupiterElements, jd, decimalYear);
  const saniLon = sideralPlanetLongitude(saturnElements, jd, decimalYear);
  return {
    guruRasi: RASI_NAMES[Math.floor(guruLon / 30)],
    saniRasi: RASI_NAMES[Math.floor(saniLon / 30)],
  };
}

// Natal chart: Moon rasi/nakshatra + Lagnam (ascendant rasi) at birth.
function computeNatalChart(y, m, d, hour, minute, lat, lon, tzOffset) {
  const hourLocal = hour + minute / 60;
  const jd = julianDay(y, m, d, hourLocal - tzOffset);
  const T = (jd - 2451545.0) / 36525;
  const moonLong = moonLongitude(T);
  const decimalYear = y + dayOfYear(y, m, d) / 365.25;
  const ayanamsa = lahiriAyanamsa(decimalYear);
  const siderealMoon = norm360(moonLong - ayanamsa);
  const nakIndex = Math.floor(siderealMoon / (360 / 27));
  const rasiIndex = Math.floor(siderealMoon / 30);

  const ascTropical = ascendantLongitude(jd, lat, lon);
  const ascSidereal = norm360(ascTropical - ayanamsa);
  const lagnamIndex = Math.floor(ascSidereal / 30);

  return {
    rasiName: RASI_NAMES[rasiIndex],
    nakName: NAKSHATRA_NAMES[nakIndex],
    lagnamName: RASI_NAMES[lagnamIndex],
  };
}

// Standard NOAA-style approximate sunrise/sunset calculator
function sunriseSunset(y, m, d, lat, lon, utcOffsetHours) {  const N = dayOfYear(y, m, d);
  const B = rad((360 / 365) * (N - 81));
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // minutes
  const decl = rad(23.45 * Math.sin(rad((360 * (284 + N)) / 365)));

  const latR = rad(lat);
  let cosH =
    (Math.sin(rad(-0.833)) - Math.sin(latR) * Math.sin(decl)) /
    (Math.cos(latR) * Math.cos(decl));
  cosH = Math.max(-1, Math.min(1, cosH));
  const H = deg(Math.acos(cosH)); // degrees

  const lstm = 15 * utcOffsetHours;
  const timeCorrection = 4 * (lon - lstm) + eot; // minutes
  const solarNoon = 12 - timeCorrection / 60; // local clock hours
  const sunrise = solarNoon - H / 15;
  const sunset = solarNoon + H / 15;
  return { sunrise, sunset, solarNoon };
}

function hoursToClock(h) {
  let hh = Math.floor(h);
  let mm = Math.round((h - hh) * 60);
  if (mm === 60) { mm = 0; hh += 1; }
  hh = ((hh % 24) + 24) % 24;
  const period = hh < 12 ? "காலை" : hh < 17 ? "மதியம்" : hh < 19 ? "மாலை" : "இரவு";
  let h12 = hh % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${String(mm).padStart(2, "0")} ${period}`;
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let curY = y;
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + " ";
    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
      ctx.fillText(line, x, curY);
      line = words[n] + " ";
      curY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, curY);
  return curY + lineHeight;
}

// Storage helper: uses the Claude-artifact window.storage API when present
// (inside claude.ai), and falls back to localStorage when it's not (e.g. this
// same file deployed standalone, like on GitHub Pages).
async function storageGet(key) {
  if (typeof window !== "undefined" && window.storage) {
    try {
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    } catch (e) { return null; }
  }
  try {
    return typeof localStorage !== "undefined" ? localStorage.getItem(key) : null;
  } catch (e) { return null; }
}
async function storageSet(key, value) {
  if (typeof window !== "undefined" && window.storage) {
    try { await window.storage.set(key, value, false); return; } catch (e) { /* fall through */ }
  }
  try { if (typeof localStorage !== "undefined") localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
}

function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function drawImageCover(ctx, img, x, y, w, h) {
  const scale = Math.max(w / img.width, h / img.height);
  const sw = img.width * scale, sh = img.height * scale;
  const dx = x + (w - sw) / 2, dy = y + (h - sh) / 2;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.drawImage(img, dx, dy, sw, sh);
  ctx.restore();
}

function computePanchangam(date, cityKey) {
  const city = CITIES[cityKey];
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const { sunrise, sunset, solarNoon } = sunriseSunset(y, m, d, city.lat, city.lon, city.tz);

  // Julian day at sunrise, converted to UT
  const jdSunrise = julianDay(y, m, d, sunrise - city.tz);
  const T = (jdSunrise - 2451545.0) / 36525;

  const sunLong = sunLongitude(T);
  const moonLong = moonLongitude(T);

  const decimalYear = y + dayOfYear(y, m, d) / 365.25;
  const ayanamsa = lahiriAyanamsa(decimalYear);
  const siderealMoon = norm360(moonLong - ayanamsa);
  const siderealSun = norm360(sunLong - ayanamsa);

  // Tithi
  const tithiAngle = norm360(moonLong - sunLong);
  const tithiIndex = Math.floor(tithiAngle / 12); // 0-29
  const paksha = tithiIndex < 15 ? "சுக்ல பட்சம்" : "கிருஷ்ண பட்சம்";
  const tIdx = tithiIndex % 15;
  const tithiName = tIdx === 14 ? (tithiIndex < 15 ? "பௌர்ணமி" : "அமாவாசை") : TITHI_NAMES[tIdx];

  // Nakshatra & Rasi (sidereal moon)
  const nakIndex = Math.floor(siderealMoon / (360 / 27));
  const rasiIndex = Math.floor(siderealMoon / 30);

  // Yoga
  const yogaAngle = norm360(sunLong + moonLong);
  const yogaIndex = Math.floor(yogaAngle / (360 / 27));

  // Karana (1 lunar month = 60 karanas: 1 fixed + 8x7 movable + 3 fixed)
  const karanaSlot = Math.floor(tithiAngle / 6); // 0-59
  let karanaName;
  if (karanaSlot === 0) karanaName = KARANA_FIXED[3]; // கிம்ஸ்துக்னம்
  else if (karanaSlot >= 57) karanaName = KARANA_FIXED[karanaSlot - 57]; // சகுனி, சதுஷ்பாதம், நாகவம்
  else karanaName = KARANA_MOVABLE[(karanaSlot - 1) % 7];

  // Tamil solar month/day (approximate)
  const monthIndex = Math.floor(siderealSun / 30);
  const degInSign = siderealSun % 30;
  const tamilDay = Math.max(1, Math.round(degInSign / (360 / 365.2564)) + 1);

  const weekday = date.getDay();
  const dayLen = sunset - sunrise;
  const part = dayLen / 8;
  const octantRange = (n) => [sunrise + (n - 1) * part, sunrise + n * part];

  const rahu = octantRange(RAHU_OCTANT[weekday]);
  const yama = octantRange(YAMA_OCTANT[weekday]);
  const kuligai = octantRange(KULIGAI_OCTANT[weekday]);
  const abhijit = [solarNoon - 0.4, solarNoon + 0.4];

  const tamilMonth = TAMIL_MONTHS[((monthIndex % 12) + 12) % 12];
  const monthIdxNorm = ((monthIndex % 12) + 12) % 12;

  // Tamil year name (60-year cycle): the year "turns over" at Chithirai (~mid-April)
  const tamilYearStartYear = monthIdxNorm >= 8 ? y - 1 : y;
  const yearNameIndex = (((38 + (tamilYearStartYear - 2025)) % 60) + 60) % 60;
  const tamilYearName = TAMIL_YEAR_NAMES[yearNameIndex];

  // Hijri date
  const hijri = gregorianToHijri(y, m, d);
  const hijriStr = `${HIJRI_MONTHS[hijri.month - 1]} ${hijri.day}`;

  // வார சூலம் + பரிகாரம்
  const soolam = SOOLAM[weekday];

  // சந்திராஷ்டமம் (8th nakshatra from the Moon)
  const chandrashtamaName = NAKSHATRA_NAMES[(nakIndex + 7) % 27];

  // அயனம் (Uttarayana/Dakshinayana) — sidereal sun in Kadagam(Cancer,3)..Margazhi(8) = Dakshinayana
  const ayanam = (monthIdxNorm >= 3 && monthIdxNorm <= 8) ? "தக்ஷிணாயனம்" : "உத்தராயணம்";

  // ருது (six traditional Tamil seasons, two months each)
  const RITU_NAMES = ["இளவேனில்", "முதுவேனில்", "கார்", "கூதிர்", "முன்பனி", "பின்பனி"];
  const rituName = RITU_NAMES[Math.floor(monthIdxNorm / 2)];

  // நட்சத்திரப் பாதம் (1-4, each nakshatra split into 4 quarters)
  const nakSpan = 360 / 27;
  const withinNak = siderealMoon % nakSpan;
  const pada = Math.floor(withinNak / (nakSpan / 4)) + 1;

  // 12-ராசி பலன் (single-word, rotates daily — sample content, see disclaimer)
  const doy = dayOfYear(y, m, d);
  const rasiPalan = RASI_NAMES.map((r, i) => ({
    rasi: r, word: RASI_PALAN_WORDS[(doy + i * 3) % RASI_PALAN_WORDS.length],
  }));
  const dailyTip = DAILY_TIPS[doy % DAILY_TIPS.length];

  // Special day detection (tithi/month based vratha & festival flags)
  const special = [];
  if (tIdx === 10) special.push("ஏகாதசி விரதம்");
  if (tIdx === 12) special.push("பிரதோஷம்");
  if (tIdx === 5) special.push("சஷ்டி விரதம்");
  if (tIdx === 3 && tithiIndex >= 15) special.push("சங்கடஹர சதுர்த்தி");
  if (tIdx === 3 && tithiIndex < 15) special.push("விநாயகர் சதுர்த்தி (மாத)");
  if (tithiName === "பௌர்ணமி" && tamilMonth === "கார்த்திகை") special.push("கார்த்திகை தீபம்");
  if (tamilMonth === "தை" && tamilDay === 1) special.push("தை பொங்கல்");
  if (tamilMonth === "ஐப்பசி" && tithiIndex === 28) special.push("தீபாவளி (தோராயம்)");
  if (tamilMonth === "புரட்டாசி" && tithiIndex < 9) special.push("நவராத்திரி");

  return {
    city, sunrise, sunset, solarNoon, dayLen, part, weekday,
    tithiName, paksha, nakName: NAKSHATRA_NAMES[nakIndex], rasiName: RASI_NAMES[rasiIndex],
    yogaName: YOGA_NAMES[yogaIndex], karanaName,
    tamilMonth, tamilDay, tamilYearName, hijriStr, soolam, chandrashtamaName, rasiPalan, dailyTip,
    ayanam, rituName, pada,
    rahu, yama, kuligai, abhijit, special,
  };
}

// Commonly published "good day" criteria for muhurtham-style events. These are
// widely cited general rules (rikta tithis and amavasai avoided everywhere;
// a standard set of nakshatras considered auspicious) — not a substitute for
// a family priest/astrologer, who also checks the couple's chart compatibility
// (porutham), which this cannot do since it only has one person's chart.
const MUHURTHAM_GOOD_NAKSHATRAS = {
  marriage: ["ரோகிணி", "மிருகசீரிடம்", "மகம்", "உத்திரம்", "ஹஸ்தம்", "சுவாதி", "அனுஷம்", "மூலம்", "உத்திராடம்", "திருவோணம்", "உத்திரட்டாதி", "ரேவதி"],
  housewarming: ["ரோகிணி", "மிருகசீரிடம்", "உத்திரம்", "ஹஸ்தம்", "சித்திரை", "சுவாதி", "அனுஷம்", "மூலம்", "உத்திராடம்", "திருவோணம்", "உத்திரட்டாதி", "ரேவதி"],
};
const MUHURTHAM_AVOID_MONTHS = { marriage: ["ஆடி", "மார்கழி"], housewarming: ["ஆடி"] };

function isGoodMuhurthamDay(data, purpose) {
  const goodNak = MUHURTHAM_GOOD_NAKSHATRAS[purpose] || MUHURTHAM_GOOD_NAKSHATRAS.marriage;
  const avoidMonths = MUHURTHAM_AVOID_MONTHS[purpose] || [];
  if (!goodNak.includes(data.nakName)) return false;
  if (avoidMonths.includes(data.tamilMonth)) return false;
  if (data.tithiName === "அமாவாசை") return false;
  // rikta tithis (4th, 9th, 14th of either paksha) are avoided for all good deeds
  const riktaNames = ["சதுர்த்தி", "நவமி", "சதுர்தசி"];
  if (riktaNames.includes(data.tithiName)) return false;
  if (data.special.some((s) => s.includes("விரதம்") || s.includes("சதுர்த்தி"))) return false;
  return true;
}

// Scans forward from a start date and returns the next `count` good days for
// the given purpose ("marriage" | "housewarming").
function findMuhurthamDays(startDate, cityKey, purpose, count) {
  const results = [];
  const d = new Date(startDate);
  d.setDate(d.getDate() + 1); // start from tomorrow
  let guard = 0;
  while (results.length < count && guard < 400) {
    const data = computePanchangam(d, cityKey);
    if (isGoodMuhurthamDay(data, purpose)) {
      results.push({
        date: new Date(d), weekday: WEEKDAY_NAMES[data.weekday],
        tamilMonth: data.tamilMonth, tamilDay: data.tamilDay, nakName: data.nakName, tithiName: data.tithiName,
      });
    }
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return results;
}

function tornClipPath(teeth) {
  const pts = ["0% 0%", "100% 0%"];
  for (let i = 0; i <= teeth; i++) {
    const x = 100 - (i * 100) / teeth;
    const y = i % 2 === 0 ? 97 : 100;
    pts.push(`${x}% ${y}%`);
  }
  return `polygon(${pts.join(", ")})`;
}

const REMINDER_TYPES = {
  birthday: { label: "பிறந்தநாள்", icon: "🎂", recurring: "yearly" },
  anniversary: { label: "திருமண நாள்", icon: "💍", recurring: "yearly" },
  bill: { label: "பில்", icon: "🧾", recurring: "once" },
  emi: { label: "EMI", icon: "💳", recurring: "once" },
  medicine: { label: "மருந்து", icon: "💊", recurring: "daily" },
  water: { label: "தண்ணீர்", icon: "💧", recurring: "daily" },
};

function nextOccurrence(r, now) {
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const type = REMINDER_TYPES[r.type];
  if (type.recurring === "yearly") {
    const [, m, d] = r.date.split("-").map(Number);
    let next = new Date(now.getFullYear(), m - 1, d);
    if (next < startToday) next.setFullYear(next.getFullYear() + 1);
    return next;
  }
  if (type.recurring === "once") {
    return new Date(r.date + "T00:00:00");
  }
  // daily
  const [hh, mm] = (r.time || "09:00").split(":").map(Number);
  let next = new Date(now);
  next.setHours(hh, mm, 0, 0);
  if (next < now) next.setDate(next.getDate() + 1);
  return next;
}

        border: `1px solid ${COLORS.gold}55`,
      }}>
        <div style={{ fontFamily: "'Tiro Tamil', serif", color: COLORS.maroon, fontSize: 15, marginBottom: 8 }}>
          வரும் நினைவூட்டல்கள்
        </div>
        {!loaded && (
          <div style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 13, color: COLORS.slate }}>ஏற்றுகிறது…</div>
        )}
        {loaded && sorted.length === 0 && (
          <div style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 13, color: COLORS.slate }}>
            இன்னும் நினைவூட்டல் எதுவும் சேர்க்கவில்லை.
          </div>
        )}
        {sorted.map((r) => {
          const rInfo = REMINDER_TYPES[r.type];
          const next = nextOccurrence(r, now);
          const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const daysUntil = Math.round((new Date(next.getFullYear(), next.getMonth(), next.getDate()) - startToday) / 86400000);
          const isPastOnce = rInfo.recurring === "once" && next < now && daysUntil < 0;
          let when;
          if (rInfo.recurring === "daily") when = `தினமும் ${hoursToClock(next.getHours() + next.getMinutes() / 60)}`;
          else if (daysUntil === 0) when = "இன்று!";
          else if (daysUntil === 1) when = "நாளை";
          else if (isPastOnce) when = "காலாவதி";
          else when = `${daysUntil} நாட்களில்`;

          return (
            <div key={r.id} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "9px 0",
              borderBottom: `1px solid ${COLORS.gold}30`,
            }}>
              <span style={{ fontSize: 20 }}>{rInfo.icon}</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 14, color: COLORS.ink, fontWeight: 600 }}>{r.title}</div>
                <div style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 12, color: isPastOnce ? COLORS.rust : COLORS.green }}>{when}</div>
              </div>
              <button onClick={() => removeReminder(r.id)} style={{
                background: "transparent", border: "none", color: COLORS.rust, fontSize: 16, cursor: "pointer",
              }}>✕</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

    (async () => {

    setMessages((m) => [...m, { role: "user", text: q }]);

    setErrorMsg(null);

      const res = await fetch(ASTROLOGER_API, {

            nakName: data.nakName, rasiName: data.rasiName, tithiName: data.tithiName,

function MonthGrid({ year, month, cityKey, onPick, selected }) {
  const monthData = useMemo(() => {
    const firstDay = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startOffset = firstDay.getDay();
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(year, month, d);
      cells.push({ day: d, data: computePanchangam(dt, cityKey), date: dt });
    }
    return cells;
  }, [year, month, cityKey]);

  const monthLabel = new Date(year, month, 1).toLocaleDateString("ta-IN", { month: "long", year: "numeric" });
  const today = new Date();

  return (
    <div>
      <div style={{ textAlign: "center", fontFamily: "'Tiro Tamil', serif", color: COLORS.maroon, fontSize: 17, marginBottom: 10 }}>
        {monthLabel}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
        {WEEKDAY_SHORT.map((w) => (
          <div key={w} style={{ textAlign: "center", fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 11, color: COLORS.slate, fontWeight: 700 }}>{w}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
        {monthData.map((cell, i) => {
          if (!cell) return <div key={i} />;
          const isToday = cell.date.toDateString() === today.toDateString();
          const isSelected = cell.date.toDateString() === selected.toDateString();
          return (
            <button key={i} onClick={() => onPick(cell.date)} style={{
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
              padding: "6px 2px", minHeight: 54, borderRadius: 8, cursor: "pointer",
              border: isSelected ? `2px solid ${COLORS.kumkum}` : isToday ? `1px solid ${COLORS.gold}` : "1px solid transparent",
              background: isSelected ? "#fff8ea" : "transparent",
            }}>
              <span style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 13, fontWeight: 700, color: COLORS.ink }}>{cell.day}</span>
              <span style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 9, color: COLORS.slate, lineHeight: 1.2 }}>{cell.data.tithiName.slice(0, 4)}</span>
              {cell.data.special.length > 0 && (
                <span style={{ width: 5, height: 5, borderRadius: 3, background: COLORS.kumkum, marginTop: 2 }} />
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function PanchangamApp() {

  }, []);
  const [deityPickerOpen, setDeityPickerOpen] = useState(false);
  const fileInputRef = useRef(null);
  const [astroHintVisible, setAstroHintVisible] = useState(true);
  useEffect(() => {
    const t = setTimeout(() => setAstroHintVisible(false), 5000);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    (async () => {
      const [savedDeity, savedPhoto] = await Promise.all([
        storageGet("selectedDeity"),
        storageGet("customDeityPhoto"),
      ]);
      if (savedPhoto) setCustomPhoto(savedPhoto);
      if (savedDeity === "custom") {
        if (savedPhoto) setDeityId("custom");
      } else if (savedDeity && DEITY_MAP[savedDeity]) {
        setDeityId(savedDeity);
      }
    })();
  }, []);

  const pickDeity = async (id) => {
    setDeityId(id);
    setDeityPickerOpen(false);
    await storageSet("selectedDeity", id);
  };

  const pickCustomPhotoFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = e.target.result;
      setCustomPhoto(dataUrl);
      setDeityId("custom");
      setDeityPickerOpen(false);
      await storageSet("customDeityPhoto", dataUrl);
      await storageSet("selectedDeity", "custom");
    };
    reader.readAsDataURL(file);
  };

  const data = useMemo(() => computePanchangam(date, cityKey), [date, cityKey]);

  const shiftDay = (delta) => {
    const nd = new Date(date);
    nd.setDate(nd.getDate() + delta);
    setDate(nd);
  };

  const shiftMonth = (delta) => {
    const nd = new Date(date);
    nd.setMonth(nd.getMonth() + delta);
    setDate(nd);
  };

  const gregorian = date.toLocaleDateString("ta-IN", { day: "numeric", month: "long", year: "numeric" });
  const deity = DEITY_MAP[deityId] || DEITY_MAP.perumal;
  const showCustomPhoto = deityId === "custom" && !!customPhoto;
  const isDay = view === "day";
  const overlayOpen = menuOpen || deityPickerOpen;

  // Synthesized paper-tear sound (Web Audio API — no external audio file needed)
  const playTearSound = () => {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const duration = 0.42;
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const decay = 1 - i / bufferSize;
        // layered crackle: base noise + faster jitter for a ripping texture
        channel[i] = (Math.random() * 2 - 1) * decay * (0.7 + 0.3 * Math.sin(i * 0.35));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.setValueAtTime(600, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(2800, ctx.currentTime + duration);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.55, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
      noise.stop(ctx.currentTime + duration);
    } catch (e) { /* audio unavailable */ }
  };

  // Next date: tear the current page off and let it fall, then advance
  const [tearOverlay, setTearOverlay] = useState(null);
  const tearTimeoutRef = useRef(null);
  const goNext = () => {
    setTearOverlay({ data, date });
    playTearSound();
    shiftDay(1);
    if (tearTimeoutRef.current) clearTimeout(tearTimeoutRef.current);
    tearTimeoutRef.current = setTimeout(() => setTearOverlay(null), 700);
  };
  const goPrev = () => shiftDay(-1);

  // Swipe: right → next date (tears off), left → previous date (plain)
  const touchStartX = useRef(null);
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    touchStartX.current = null;
    if (Math.abs(dx) < 40) return;
    if (dx > 0) goNext();
    else goPrev();
  };

  // Measure the real viewport in pixels — CSS vh is unreliable on mobile
  // (browser toolbars resize it), so we pin exact pixel heights instead.
  const [vh, setVh] = useState(() => (typeof window !== "undefined" ? window.innerHeight : 700));
  useEffect(() => {
    const update = () => setVh(window.innerHeight);
    update();
    window.addEventListener("resize", update);
    window.addEventListener("orientationchange", update);
    return () => {
      window.removeEventListener("resize", update);
      window.removeEventListener("orientationchange", update);
    };
  }, []);

  // Force the real document to never scroll while on the single-screen day view.
  useEffect(() => {
    if (isDay) {
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";
      document.body.style.margin = "0";
      document.documentElement.style.height = "100%";
      document.body.style.height = "100%";
    } else {
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
    }
    return () => {
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
    };
  }, [isDay]);

  const heroH = isDay ? Math.round(vh * 0.5) : 200;
  const contentH = isDay ? vh - heroH : null;

  return (
    <div style={{
      height: isDay ? vh : "auto", minHeight: isDay ? vh : "100vh", overflow: isDay ? "hidden" : "visible",
      background: "#DCD2B8", display: "flex", flexDirection: "column", boxSizing: "border-box",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Tiro+Tamil:ital@0;1&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Bitter:wght@700;800&display=swap');
        html, body { margin: 0; padding: 0; }
        @keyframes tearFall {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          25% { transform: translateY(6px) rotate(3deg); opacity: 1; }
          100% { transform: translateY(160%) rotate(22deg); opacity: 0; }
        }
      `}</style>

      {/* ── Full-bleed deity/photo hero: half the screen ── */}
      <div onClick={() => { setDeityPickerOpen((v) => !v); setMenuOpen(false); }} style={{
        position: "relative", width: "100%",
        flex: isDay ? `0 0 ${heroH}px` : "0 0 200px",
        background: showCustomPhoto ? "#000" : `radial-gradient(circle at 50% 35%, ${deity.color}, ${COLORS.maroon} 85%)`,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        cursor: "pointer", overflow: "hidden", boxSizing: "border-box", minHeight: 0,
      }}>
        <button onClick={(e) => { e.stopPropagation(); setMenuOpen((v) => !v); setDeityPickerOpen(false); }} style={{
          position: "absolute", top: 10, right: 10, width: 38, height: 38, borderRadius: 10,
          background: "rgba(0,0,0,0.25)", border: `1px solid ${COLORS.gold}88`, color: COLORS.paper,
          fontSize: 17, cursor: "pointer", zIndex: 10,
        }}>☰</button>

        {showCustomPhoto ? (
          <img src={customPhoto} alt="" style={{
            position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover",
          }} />
        ) : (
          <>
            <span style={{ fontSize: Math.min(heroH * 0.42, 110), filter: "drop-shadow(0 6px 14px rgba(0,0,0,0.4))" }}>{deity.symbol}</span>
            <div style={{ fontFamily: "'Tiro Tamil', serif", fontSize: 22, color: COLORS.paper, marginTop: 4, fontWeight: 700 }}>
              {deity.name}

        <div style={{

                  position: "absolute", inset: 0, zIndex: 15, pointerEvents: "none",
                  display: "flex", flexDirection: "column", justifyContent: "center",
                  animation: "tearFall 0.65s ease-in forwards", transformOrigin: "top center",
                }}>
                  <TearCalendarPage data={tearOverlay.data} date={tearOverlay.date} />
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ── Floating astrologer chatbot — always reachable ── */}
      {view !== "astrologer" && !overlayOpen && (
        <div style={{ position: "fixed", bottom: 16, left: 16, zIndex: 17, display: "flex", alignItems: "flex-end", gap: 8 }}>
          <div style={{
            opacity: astroHintVisible ? 1 : 0, transition: "opacity 0.8s ease", pointerEvents: "none",
            background: "#fff8ea", border: `1px solid ${COLORS.gold}`, borderRadius: 12, padding: "8px 12px",
            maxWidth: 170, boxShadow: "0 3px 10px rgba(0,0,0,0.25)",
          }}>
            <div style={{ fontFamily: "'Tiro Tamil', serif", fontSize: 12, color: COLORS.calendarRed, fontWeight: 700 }}>ஜோதிட சிகாமணி</div>
            <div style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 10.5, color: COLORS.ink, marginTop: 2, lineHeight: 1.3 }}>
              உங்களது அனைத்து சந்தேகங்களுக்கும் ஜோதிடரை கேளுங்கள்
            </div>
          </div>
          <button onClick={() => { setView("astrologer"); setMenuOpen(false); setDeityPickerOpen(false); }} style={{
            width: 56, height: 56, borderRadius: "50%", flexShrink: 0,
            background: `linear-gradient(135deg, ${COLORS.calendarRed}, ${COLORS.maroon})`,
            border: `2px solid ${COLORS.gold}`, color: COLORS.paper, fontSize: 24, cursor: "pointer",
            boxShadow: "0 4px 12px rgba(0,0,0,0.35)", display: "flex", alignItems: "center", justifyContent: "center",
          }} aria-label="ஜோதிட சிகாமணி">🔮</button>
        </div>
      )}

      {/* ── Overlay backdrop ── */}
      {overlayOpen && (
        <div onClick={() => { setMenuOpen(false); setDeityPickerOpen(false); }} style={{
          position: "fixed", inset: 0, background: "rgba(20,12,8,0.45)", zIndex: 20,
        }} />
      )}

      {/* ── Deity picker bottom sheet ── */}
      {deityPickerOpen && (
        <div style={{
          position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 21,
          background: "#fff8ea", padding: "18px 16px", borderRadius: "16px 16px 0 0",
          maxHeight: "70vh", overflowY: "auto", boxShadow: "0 -4px 16px rgba(0,0,0,0.25)",
        }}>
          <div style={{ fontFamily: "'Tiro Tamil', serif", color: COLORS.maroon, fontSize: 15, marginBottom: 12, textAlign: "center" }}>
            படத்தைத் தேர்ந்தெடுக்கவும்
          </div>
          <input
            ref={fileInputRef} type="file" accept="image/*" style={{ display: "none" }}
            onChange={(e) => pickCustomPhotoFile(e.target.files && e.target.files[0])}
          />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, maxWidth: 420, margin: "0 auto" }}>
            <button onClick={() => {
              if (customPhoto) { pickDeity("custom"); }
              else if (fileInputRef.current) { fileInputRef.current.click(); }
            }} style={{
              display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
              background: "transparent", border: "none", cursor: "pointer", flexShrink: 0, padding: 2, position: "relative",
            }}>
              <span style={{
                width: 48, height: 48, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                background: showCustomPhoto ? `center/cover url(${customPhoto})` : COLORS.parchmentDeep,
                fontSize: 20, border: showCustomPhoto ? `3px solid ${COLORS.calendarRed}` : `2px dashed ${COLORS.slate}`,
              }}>{!customPhoto ? "📷" : ""}</span>
              {customPhoto && (
                <span
                  onClick={(e) => { e.stopPropagation(); fileInputRef.current && fileInputRef.current.click(); }}
                  style={{
                    position: "absolute", top: -2, right: 2, width: 18, height: 18, borderRadius: "50%",
                    background: COLORS.maroon, color: COLORS.paper, fontSize: 10, display: "flex",
                    alignItems: "center", justifyContent: "center", border: `1px solid ${COLORS.paper}`,
                  }}
                >✎</span>
              )}
              <span style={{ fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 10, color: COLORS.ink, fontWeight: showCustomPhoto ? 700 : 500 }}>
                {customPhoto ? "என் படம்" : "படம் சேர்"}
              </span>
            </button>
            {DEITIES.map((d) => (
              <DeityBadge key={d.id} deity={d} selected={d.id === deityId} onClick={() => pickDeity(d.id)} />
            ))}
          </div>
        </div>
      )}

      {/* ── Menu bottom sheet: views, city, date nav ── */}
      {menuOpen && (
        <div style={{
          position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 21,
          background: "#fff8ea", padding: "18px 16px", borderRadius: "16px 16px 0 0",
          boxShadow: "0 -4px 16px rgba(0,0,0,0.25)",
        }}>
          <div style={{ maxWidth: 420, margin: "0 auto" }}>
            <div style={{ display: "flex", gap: 5, marginBottom: 12, flexWrap: "wrap" }}>
              <button onClick={() => { setView("day"); setMenuOpen(false); }} style={tabBtn(view === "day")}>தினசரி</button>
              <button onClick={() => { setView("month"); setMenuOpen(false); }} style={tabBtn(view === "month")}>மாதம்</button>
              <button onClick={() => { setView("reminder"); setMenuOpen(false); }} style={tabBtn(view === "reminder")}>நினைவூட்டல்</button>
              <button onClick={() => { setView("spiritual"); setMenuOpen(false); }} style={tabBtn(view === "spiritual")}>ஆன்மீகம்</button>
              <button onClick={() => { setView("astrologer"); setMenuOpen(false); }} style={tabBtn(view === "astrologer")}>ஜோதிடர்</button>
            </div>
            {(view === "day" || view === "month") && (
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <select value={cityKey} onChange={(e) => setCityKey(e.target.value)} style={{
                  flex: 1, padding: "8px 10px", borderRadius: 8, border: `1px solid ${COLORS.gold}`,
                  background: "#fffdf6", color: COLORS.ink, fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 13,
                }}>
                  {Object.entries(CITIES).map(([k, c]) => (
                    <option key={k} value={k}>{c.label}</option>
                  ))}
                </select>
                {view === "day" ? (
                  <>
                    <button onClick={() => goPrev()} style={navBtn}>◀</button>
                    <button onClick={() => setDate(new Date())} style={navBtn}>இன்று</button>
                    <button onClick={() => goNext()} style={navBtn}>▶</button>
                  </>
                ) : (
                  <>
                    <button onClick={() => shiftMonth(-1)} style={navBtn}>◀</button>
                    <button onClick={() => setDate(new Date())} style={navBtn}>இன்று</button>
                    <button onClick={() => shiftMonth(1)} style={navBtn}>▶</button>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const navBtn = {
  padding: "8px 12px", borderRadius: 8, border: `1px solid ${COLORS.gold}`,
  background: COLORS.maroon, color: COLORS.parchment, fontFamily: "'Noto Sans Tamil', sans-serif",
  fontSize: 13, cursor: "pointer",
};

const tabBtn = (active) => ({
  flex: "1 1 auto", minWidth: 76, padding: "8px 4px", borderRadius: 8, border: `1px solid ${COLORS.gold}`,
  background: active ? COLORS.maroon : "transparent", color: active ? COLORS.parchment : COLORS.maroon,
  fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 12, fontWeight: 600, cursor: "pointer",
});

const pageTabBtn = (active) => ({
  flex: 1, padding: "3px 0", borderRadius: 5, border: `1px solid ${COLORS.paperShade}`,
  background: active ? COLORS.calendarRed : "transparent", color: active ? COLORS.paper : COLORS.slate,
  fontFamily: "'Noto Sans Tamil', sans-serif", fontSize: 9, fontWeight: 600, cursor: "pointer",
});


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PanchangamApp />);
</script>
</body>
</html>
